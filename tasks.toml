- The project architecture remains the same.
  - `src/lib.rs:459-513` still owns GUI process startup and MCP transport.
  - `ui/gui.ts` still owns GTK UI composition, controller wiring, and file watching.
  - `build.rs:13-42` still compiles `ui/gui.ts` to embedded JS; it now also adds an explicit type-check step before emit, which is aligned with the task verification requirement rather than an architectural change.
- Scope is still correct.
  - No unrelated subsystem changes were introduced beyond updating `integration_tests.sh` to match the existing long-flag CLI contract.
  - No backend command semantics, task file format, or MCP protocol boundary changed.

